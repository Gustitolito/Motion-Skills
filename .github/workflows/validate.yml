name: Validate studio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:skills
      - run: npm run test:projects
      - run: npm run test:smoke
      - run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-render
          path: |
            out/stills/smoke-test.png
            out/previews/smoke-test.mp4
            out/validation/
